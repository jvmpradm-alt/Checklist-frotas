name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Abrir projeto
        run: |
          test -f projeto.zip || { echo "Envie o arquivo projeto.zip para o repositorio"; exit 1; }
          mkdir build-app && unzip -q projeto.zip -d build-app
          echo "sdk.dir=$ANDROID_HOME" > build-app/local.properties

      - name: Preparar Android e Gradle
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" > /dev/null
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d "$HOME"

      - name: Compilar APK assinado
        working-directory: build-app
        run: $HOME/gradle-8.7/bin/gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp build-app/app/build/outputs/apk/release/app-release.apk checklist-frota-v1.0.${{ github.run_number }}.apk

      - name: Publicar versao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Checklist Frota v1.0.${{ github.run_number }}
          body: APK pronto. Baixe o arquivo .apk abaixo e envie para os celulares da equipe.
          files: checklist-frota-*.apk
