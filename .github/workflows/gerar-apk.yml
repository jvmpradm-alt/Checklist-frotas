name: Gerar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Abrir projeto
        run: |
          test -f projeto.zip || { echo "Envie o arquivo projeto.zip para o repositorio"; exit 1; }
          mkdir build-app && unzip -q projeto.zip -d build-app

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar APK assinado
        working-directory: build-app
        run: gradle assembleRelease --no-daemon

      - name: Renomear
        run: cp build-app/app/build/outputs/apk/release/app-release.apk checklist-frota-v1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: checklist-frota-apk
          path: checklist-frota-*.apk

      - name: Publicar versao
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Checklist Frota v1.0.${{ github.run_number }}
          body: APK pronto. Baixe o arquivo .apk abaixo e envie para os celulares da equipe.
          files: checklist-frota-*.apk
